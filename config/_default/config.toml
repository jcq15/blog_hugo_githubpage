Title =  "Shadiao Garden"
BaseUrl = "https://blog.shadiao.win/"

DefaultContentLanguage = "zh-cn"
disableLanguages = ["en"]
LanguageCode = "zh-CN"

Theme =  "hugo-theme-next"

MetaDataFormat =  "toml"

PaginatePath =  "p"
Paginate = 5

DisablePathToLower =  false

PreserveTaxonomyNames = false

PygmentsStyle = "emacs"
pygmentsCodefences = true
pygmentsCodefencesGuessSyntax = true

enableRobotsTXT = true
enableEmoji = false
hasCJKLanguage = true

timeout = 100000
ignoreErrors = ["error-remote-getjson"]

[sitemap]
  filename = "sitemap.xml"

[[module.mounts]]
  source = "static"
  target = "static"
  excludeFiles = ["en/**"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/xml"
    baseName = "searchindex"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

## 让Markdown支持写HTML语法
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
