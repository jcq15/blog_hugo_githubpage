{{ define "main_content" }}
<section class="archive">
  <h1>{{ .Title }}</h1>
  <div class="section-heading"><h2>盘便研究所</h2><a href="/poop-studio/">打开独立页面 ↗</a></div>
  <iframe id="studio" title="盘便研究所小游戏" src="/poop-studio/" style="display:block;width:100%;height:760px;border:0;border-radius:18px"></iframe>
</section>
<script>
const studio = document.querySelector('#studio');
function fitStudio() {
  const main = studio.contentDocument?.querySelector('main');
  if (!main) return;
  const resize = () => { studio.style.height = Math.ceil(main.getBoundingClientRect().height) + 'px'; };
  new ResizeObserver(resize).observe(main);
  resize();
}
if (studio.contentDocument?.readyState === 'complete' && studio.contentDocument.querySelector('main')) fitStudio();
else studio.addEventListener('load', fitStudio, {once:true});
</script>
{{ end }}
