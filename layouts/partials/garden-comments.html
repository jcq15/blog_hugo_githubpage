{{ if .Site.Params.Comment.Enable }}<section class="comments"><h2>来聊两句</h2>{{ if .Site.IsServer }}<p class="muted">本地预览不连接线上评论。正式页面沿用原来的 GitHub utterances 评论与文章标题关联。</p>{{ else }}<script src="https://utteranc.es/client.js" repo="{{ .Site.Params.Comment.UtterancesRepo }}" issue-term="{{ .Site.Params.Comment.UtterancesTitle }}" theme="{{ .Site.Params.Comment.UtterancesTheme }}" crossorigin="anonymous" async></script>{{ end }}</section>{{ end }}
